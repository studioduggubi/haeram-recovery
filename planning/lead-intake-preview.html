<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>해람 전화 상담 접수 · UX 미리보기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0eee5;color:#292d25;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;word-break:keep-all}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a68a53;outline-offset:3px}main{max-width:480px;margin:28px auto;padding:0 18px 24px}.preview{font-size:11px;line-height:1.6;color:#6c705e;text-align:center;margin:0 0 14px}.card{background:#fffdf7;border:1px solid #d9ddcd;border-radius:20px;padding:25px 24px;box-shadow:0 12px 40px #30322308}.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand img{width:145px;height:auto}.step{font-size:12px;color:#866e3f}.track{height:3px;background:#e5e7dc;margin:20px 0}.track>span{display:block;height:100%;background:#8b7547;transition:width .2s}.eyebrow{font-size:11px;font-weight:700;color:#8c7244;margin:0 0 8px}h1,h2,p{margin:0}h1{font-size:25px;line-height:1.4;letter-spacing:-.06em;margin-bottom:10px}.desc{font-size:13px;color:#626b56;line-height:1.7;margin-bottom:18px}.choices{display:grid;gap:9px}.choice{text-align:left;width:100%;border:1px solid #d8ddcd;border-radius:10px;background:#fffdf7;color:#30382a;padding:13px 14px;min-height:49px;line-height:1.5;font-size:14px}.choice[aria-pressed=true]{background:#e9eddf;border-color:#7b8967;box-shadow:inset 0 0 0 1px #7b8967}.choice .hint{display:block;font-size:11px;color:#6a735d;margin-top:3px}.choice:hover{background:#f0f1e7}.tiny{font-size:11px;color:#737b67;line-height:1.6}.reassure{display:flex;gap:8px;align-items:flex-start;margin-top:17px;padding:11px 12px;background:#f1f0e7;border-radius:9px;font-size:11px;color:#626b56}.group{margin-top:18px}legend,label.field{font-weight:600;font-size:13px;display:block;margin-bottom:8px}fieldset{padding:0;border:0;margin:0 0 17px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}.chips .choice{font-size:12px;min-height:43px;padding:9px 10px;text-align:center}.field small{font-weight:400;color:#7c826f;font-size:11px}.text-input,select{display:block;width:100%;border:1px solid #d4d9c7;border-radius:9px;padding:11px 12px;background:#fffef9;color:#293126;min-height:46px;font-size:15px;margin-top:7px}.phone{letter-spacing:.03em}.form-field{margin-bottom:14px}.actions{display:flex;gap:10px;align-items:center;margin-top:18px}.primary{display:block;background:#2c3227;color:white;border:0;border-radius:9px;min-height:48px;font-weight:600;font-size:14px;padding:12px 15px;width:100%}.back{background:none;border:0;color:#6f7762;font-size:12px;padding:9px 0;white-space:nowrap}.primary:disabled{background:#b7bda9;cursor:not-allowed}.summary{padding:12px 14px;background:#f0f1e7;border-radius:10px;font-size:12px;margin-bottom:18px;color:#536047}.summary strong{display:block;font-size:12px;color:#30392b;margin-bottom:4px}.summary p{margin:3px 0}.consent{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.7;font-weight:400;cursor:pointer;margin-top:16px}.consent input{margin:5px 0 0;width:16px;height:16px;flex-shrink:0;accent-color:#566446}details{font-size:11px;color:#737b67;margin:7px 0 0 25px}summary{cursor:pointer}details p{margin-top:6px}.error{color:#9d442b;font-size:12px;line-height:1.6;margin-top:9px;min-height:0}.footer{font-size:11px;text-align:center;color:#737b67;margin-top:15px}.footer a{color:inherit;text-underline-offset:3px}.optional{color:#7d846e;font-size:11px}.finish-symbol{width:48px;height:48px;display:grid;place-items:center;background:#e4ebd9;color:#5c704d;border-radius:50%;font-size:25px;margin-bottom:14px}.preview-note{border-top:1px solid #d8ddcc;margin-top:16px;padding-top:12px;font-size:11px;color:#747b68}[hidden]{display:none!important}@media(max-width:350px){main{padding:0 14px;margin:16px auto}.card{padding:20px 18px}h1{font-size:22px}.desc{font-size:12px}.choice{font-size:12px;padding:11px 12px}.brand img{width:130px}}
.optional-fields{margin:12px 0;border-top:1px solid #dce0d1;border-bottom:1px solid #dce0d1}.optional-fields>summary{font-size:12px;color:#69745c;padding:10px 0}.optional-fields .form-field{margin:8px 0 14px}.summary{margin-bottom:14px;padding:10px 12px}.summary strong{margin-bottom:3px}.summary p{margin:0}#lead-form>.form-field{margin-bottom:10px}</style></head><body><main><p class="preview">UX 미리보기 · 실제 저장·메일 전송 없음<br>실제 개인정보 대신 예시 번호로 확인해주세요.</p><div class="card"><div class="brand"><img src="../assets/official-logo.png" alt="해람 법무사" width="393" height="76"><span class="step" id="step">1 / 3</span></div><div class="track" aria-hidden="true"><span id="progress" style="width:33.33%"></span></div><div id="screen"></div></div><p class="footer"><a href="ai-intake-plan.html">접수 흐름·시트 구성 보기</a></p></main><script>
'use strict';
(()=>{
 const root=document.getElementById('screen');
 const data={concern:'',income:'',debt:'',name:'',phone:'',time:''};
 const concerns=['매달 갚을 돈이 부담돼요','독촉·압류가 걱정돼요','법원 문서·기한이 있어요','회생·파산부터 알아보고 싶어요'];
 const incomes=['정기적인 소득이 있어요','수입이 일정하지 않아요','현재 소득이 거의 없어요'];
 const debts=['3천만원 미만','3천만~1억원 미만','1억원 이상','잘 모르겠어요'];
 const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let step=1;
 function heading(text,desc){return '<p class="eyebrow">짧게 남기는 전화 상담 요청</p><h1 tabindex="-1">'+text+'</h1><p class="desc">'+desc+'</p>';}
 function render(focus=false){
  document.getElementById('step').textContent=step<=3?step+' / 3':'미리보기 완료';document.getElementById('progress').style.width=Math.min(step,3)/3*100+'%';
  if(step===1){
   root.innerHTML=heading('지금, 무엇이 가장<br>걱정되세요?','가장 먼저 이야기하고 싶은 한 가지만 골라주세요.')+'<div class="choices">'+concerns.map((v,i)=>'<button class="choice" type="button" data-concern="'+i+'" aria-pressed="'+(data.concern===v)+'">'+v+'</button>').join('')+'</div><p class="reassure"><span aria-hidden="true">✓</span>연락처는 마지막에 남겨요. 상담 요청을 누르기 전에는 사무실로 전달하지 않아요.</p>';
   root.querySelectorAll('[data-concern]').forEach(e=>e.addEventListener('click',()=>{data.concern=concerns[Number(e.dataset.concern)];step=2;render(true);}));
  }else if(step===2){
   const choices=(key,options)=>'<div class="chips">'+options.map((v,i)=>'<button class="choice" type="button" data-field="'+key+'" data-index="'+i+'" aria-pressed="'+(data[key]===v)+'">'+v+'</button>').join('')+'</div>';
   root.innerHTML=heading('첫 상담에 필요한<br>두 가지만 여쭐게요.','정확한 금액이나 서류는 지금 필요 없어요.')+'<fieldset><legend>현재 소득은 어떤가요?</legend>'+choices('income',incomes)+'</fieldset><fieldset><legend>채무는 대략 어느 정도인가요?</legend>'+choices('debt',debts)+'</fieldset><p class="tiny">이 답변만으로 회생·파산 가능 여부를 판단하지 않습니다.</p><div class="actions"><button class="back" data-back type="button">← 이전</button><button class="primary" id="next" type="button" '+(!data.income||!data.debt?'disabled':'')+'>연락받을 번호 남기기 →</button></div>';
   root.querySelectorAll('[data-field]').forEach(e=>e.addEventListener('click',()=>{const k=e.dataset.field;data[k]=(k==='income'?incomes:debts)[Number(e.dataset.index)];root.querySelectorAll('[data-field="'+k+'"]').forEach(c=>c.setAttribute('aria-pressed',String(c===e)));document.getElementById('next').disabled=!data.income||!data.debt;}));
   document.getElementById('next').addEventListener('click',()=>{step=3;render(true);});
  }else if(step===3){
   root.innerHTML=heading('어느 번호로<br>연락드리면 될까요?','해람법무사에서 상담 연락을 드리기 위한 번호예요.')+'<div class="summary"><strong>남겨주신 상황</strong><p>'+esc(data.concern)+' · '+esc(data.income)+' · '+esc(data.debt)+'</p></div><form id="lead-form" novalidate><div class="form-field"><label class="field" for="customer-phone">연락 가능한 전화번호 <small>필수</small></label><input class="text-input phone" id="customer-phone" name="phone" type="tel" inputmode="tel" autocomplete="off" required maxlength="20" placeholder="010-0000-0000" value="'+esc(data.phone)+'" aria-describedby="phone-note form-error"><p class="tiny" id="phone-note" style="margin-top:6px">연락받으실 번호가 맞는지 한 번 확인해주세요.</p></div><details class="optional-fields"><summary>이름·연락 시간 남기기 <span class="optional">선택</span></summary><div class="form-field"><label class="field" for="customer-name">불러드릴 이름 <small>선택 · 별칭도 괜찮아요</small></label><input class="text-input" id="customer-name" name="name" autocomplete="off" maxlength="30" placeholder="예: 김해람" value="'+esc(data.name)+'"></div><div class="form-field"><label class="field" for="contact-time">연락받기 편한 시간 <small>선택</small></label><select id="contact-time" name="time"><option value="">선택하지 않아도 괜찮아요</option><option>오전이 편해요</option><option>오후가 편해요</option><option>시간을 먼저 조율하고 싶어요</option></select></div></details><label class="consent"><input id="consent" type="checkbox" required><span>상담 연락을 위한 개인정보 수집·이용 안내를 확인하고 동의합니다. <span class="optional">필수</span></span></label><details><summary>어떤 정보가 전달되나요?</summary><p>선택한 상황·소득·채무 범위와 직접 입력한 이름·전화번호·희망 시간을 해람법무사 사무소에 전달하는 화면의 예시입니다. 주민등록번호나 서류는 요구하지 않습니다. 실제 서비스의 보관 기간·처리방침 문구는 연결 전 확정합니다. 이 미리보기는 전송·저장하지 않습니다.</p></details><p class="error" id="form-error" role="alert"></p><div class="actions"><button class="back" data-back type="button">← 이전</button><button class="primary" type="submit">이 내용으로 전화 상담 요청하기</button></div></form>';
   document.getElementById('contact-time').value=data.time;
   const save=()=>{data.name=document.getElementById('customer-name').value.trim();data.phone=document.getElementById('customer-phone').value.trim();data.time=document.getElementById('contact-time').value;};
   document.getElementById('lead-form').addEventListener('submit',e=>{e.preventDefault();save();const digits=data.phone.replace(/\D/g,'');const error=document.getElementById('form-error');if(!digits){error.textContent='연락 가능한 전화번호를 입력해주세요.';document.getElementById('customer-phone').focus({preventScroll:true});return;}if(!/^0(?:1[016789]\d{7,8}|2\d{7,8}|[3-6]\d\d{7,8})$/.test(digits)){error.textContent='전화번호를 확인해주세요. 예: 010-0000-0000';document.getElementById('customer-phone').focus({preventScroll:true});return;}if(!document.getElementById('consent').checked){error.textContent='상담 연락을 위한 수집·이용 동의를 확인해주세요.';return;}data.phone=digits;step=4;render(true);});
   root.querySelector('[data-back]').addEventListener('click',()=>{save();step=2;render(true);});
  }else{
   root.innerHTML='<div class="finish-symbol" aria-hidden="true">✓</div>'+heading('이런 내용으로<br>연락을 이어갑니다.','접수 완료 화면의 예시예요. 실제로 저장되거나 발송되지는 않았습니다.')+'<div class="summary"><strong>'+esc(data.name||'고객')+'님의 상담 요청 예시</strong><p>연락처: '+esc(data.phone.slice(0,3)+'-****-'+data.phone.slice(-4))+'</p><p>'+esc(data.concern)+'</p><p>'+esc(data.income)+' · '+esc(data.debt)+'</p><p>'+esc(data.time||'연락 시간 미선택')+'</p></div><p class="desc">실제 연결 후에는 접수 완료를 확인하고, 남겨주신 번호로 상담 연락을 드린다는 안내를 보여줍니다.</p><button type="button" class="primary" id="restart">처음부터 다시 보기</button>';
   document.getElementById('restart').addEventListener('click',()=>{step=1;render(true);});
  }
  if(step===2)root.querySelector('[data-back]').addEventListener('click',()=>{step=1;render(true);});
  if(focus)root.querySelector('h1').focus({preventScroll:true});
 }
 render();
})();
</script></body></html>
